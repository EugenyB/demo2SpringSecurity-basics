<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + #{app.title}">Security Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="navbar" class="navbar">
    <a class="brand" th:href="@{/}">[[#{app.name}]]</a>

    <nav class="nav-links">
        <a th:href="@{/}">[[#{nav.home}]]</a>
        <a th:if="${currentUser != null}" th:href="@{/guest}">[[#{nav.guest}]]</a>
        <a th:if="${currentUser != null and currentUser.hasAnyRole('USER', 'ADMIN')}" th:href="@{/user}">[[#{nav.user}]]</a>
        <a th:if="${currentUser != null and currentUser.hasRole('ADMIN')}" th:href="@{/admin}">[[#{nav.admin}]]</a>
    </nav>

    <div class="nav-auth">
        <th:block th:if="${currentUser != null}">
            <span class="nav-user">
                <strong th:text="${currentUser.username}">name</strong>
                <span class="badge" th:each="r : ${currentUser.roles}" th:text="${r}"
                      th:classappend="'badge-' + ${#strings.toLowerCase(r)}">ROLE</span>
            </span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline">[[#{nav.logout}]]</button>
            </form>
        </th:block>
        <a th:if="${currentUser == null}" th:href="@{/login}" class="btn btn-primary">[[#{nav.login}]]</a>
        <select onchange="location.href='?lang=' + this.value" class="lang-selector">
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            <option value="uk" th:selected="${#locale.language == 'uk'}">Українська</option>
        </select>
    </div>
</header>

<footer th:fragment="footer" class="footer">
    <p th:text="#{footer.text}">Spring Security demo · Spring Boot & Thymeleaf</p>
</footer>

</body>
</html>
