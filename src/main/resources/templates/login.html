<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.login})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-narrow">
    <section class="panel">
        <h1>[[#{login.title}]]</h1>

        <div class="alert alert-error" th:if="${param.error}" th:text="#{login.error}">
            Invalid username or password.
        </div>
        <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.logout}">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post" class="form">
            <label for="username" th:text="#{login.username}">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">

            <label for="password" th:text="#{login.password}">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" class="btn btn-primary btn-block">[[#{login.button}]]</button>
        </form>

        <p class="hint" th:utext="#{login.hint}">Try <code>admin / admin123</code>, <code>user / user123</code>
            or <code>guest / guest123</code>.</p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
