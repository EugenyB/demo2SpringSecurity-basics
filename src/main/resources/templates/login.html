<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-narrow">
    <section class="panel">
        <h1>Log in</h1>

        <div class="alert alert-error" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post" class="form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="hint">Try <code>admin / admin123</code>, <code>user / user123</code>
            or <code>guest / guest123</code>.</p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
