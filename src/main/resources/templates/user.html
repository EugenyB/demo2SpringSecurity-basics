<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.user})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <section class="panel">
        <h1>[[#{user.title}]]</h1>
        <p th:text="#{user.greeting(${currentUser.username})}">
            Hello, user. This page requires the USER or ADMIN role.
        </p>
        <p>[[#{user.roles}]]
            <span class="badge" th:each="r : ${currentUser.roles}" th:text="${r}"
                  th:classappend="'badge-' + ${#strings.toLowerCase(r)}">ROLE</span>
        </p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
