<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.access-denied})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container-narrow">
    <section class="panel panel-center">
        <p class="error-code" th:text="#{access-denied.code}">403</p>
        <h1>[[#{access-denied.title}]]</h1>
        <p th:text="#{access-denied.message}">Your account does not have the role required to open this page.</p>
        <a th:href="@{/}" class="btn btn-primary">[[#{access-denied.btn}]]</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
