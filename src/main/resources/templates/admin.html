<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.admin})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <section class="panel">
        <h1>[[#{admin.title}]]</h1>
        <p th:text="#{admin.greeting(${currentUser.username})}">
            Hello, admin. This page requires the ADMIN role.
        </p>

        <h2>[[#{admin.accounts}]]</h2>
        <table class="table">
            <thead>
            <tr><th th:text="#{admin.table.username}">Username</th><th th:text="#{admin.table.role}">Role</th><th th:text="#{admin.table.description}">Description</th></tr>
            </thead>
            <tbody>
            <tr th:each="account : ${accounts}">
                <td th:text="${account.username}">name</td>
                <td>
                    <span class="badge" th:text="${account.role}"
                          th:classappend="'badge-' + ${#strings.toLowerCase(account.role)}">ROLE</span>
                </td>
                <td th:text="${account.description}">description</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
